<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ストップ!だるまさん</title>

  <link rel="stylesheet" href="home.css" />
</head>

<body>
  <main class="home">
    <div class="title">ストップ!だるまさん</div>

    <div class="subtitle">
      MESHの動きセンサとスマートフォンを使った<br />
      リアルタイム判定システム
    </div>

    <section class="cards">
      <a class="card" href="parent/parent.html">
        <div class="icon parent-icon">👀</div>
        <div class="card-title">親端末用画面</div>
        <div class="card-text">
          スクリーン表示・競技開始・停止・アウト判定を行う画面です。<br />
          先生・運営者・大型モニター用。
        </div>
      </a>

      <a class="card" href="player/player.html">
        <div class="icon player-icon">🏃</div>
        <div class="card-title">子端末用画面</div>
        <div class="card-text">
          参加者番号を設定し、MESHからのスペースキー入力を送信する画面です。<br />
          各参加者のスマートフォン用。
        </div>
      </a>
    </section>

    <div class="note">
      親端末は1台、子端末は参加者ごとに1台ずつ開いてください。<br />
      子端末では、参加者番号を設定したあと「この画面を有効化」を押してから競技を開始してください。
    </div>

    <div class="footer">
      Daruma MESH System
    </div>
  </main>
</body>
</html>
