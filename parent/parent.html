<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>だるまさんが転んだ 親端末</title>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Yu Gothic", sans-serif;
      margin: 0;
      background: #020617;
      color: white;
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      font-size: 38px;
      margin: 0 0 18px;
      text-align: center;
    }

    .top-panel {
      background: #111827;
      padding: 18px;
      border-radius: 22px;
      margin-bottom: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    button {
      padding: 16px 28px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 16px;
      cursor: pointer;
    }

    .start-btn {
      background: #22c55e;
      color: #052e16;
    }

    .stop-btn {
      background: #ef4444;
      color: white;
    }

    .reset-btn {
      background: #e5e7eb;
      color: #111827;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 20px;
      align-items: stretch;
    }

    .daruma-panel {
      background: #111827;
      border-radius: 28px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 520px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    .daruma-img {
      max-width: 420px;
      width: 80%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 24px 32px rgba(0,0,0,0.45));
    }

    .mode {
      margin-top: 24px;
      width: 100%;
      text-align: center;
      font-size: 72px;
      font-weight: 900;
      padding: 26px;
      border-radius: 24px;
      box-sizing: border-box;
      background: #374151;
    }

    .mode.running {
      background: #16a34a;
    }

    .mode.stop {
      background: #dc2626;
      animation: pulse 0.35s ease-in-out infinite alternate;
    }

    .side-panel {
      background: #111827;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    .turn {
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 14px;
    }

    .message {
      min-height: 58px;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      color: #fbbf24;
      margin-bottom: 18px;
    }

    .players {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
      margin-top: 16px;
    }

    .player-card {
      aspect-ratio: 1 / 1;
      border-radius: 20px;
      background: #334155;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 44px;
      font-weight: 900;
      box-shadow: inset 0 -8px 0 rgba(0,0,0,0.2);
      transition: 0.2s;
    }

    .player-card.out {
      background: #ef4444;
      color: white;
      transform: scale(1.08);
      box-shadow: 0 0 30px rgba(239,68,68,0.85);
    }

    .settings {
      margin-top: 24px;
      padding: 16px;
      border-radius: 18px;
      background: #1f2937;
      color: #d1d5db;
      font-size: 15px;
      line-height: 1.7;
    }

    .log {
      margin-top: 16px;
      color: #9ca3af;
      font-size: 14px;
      min-height: 20px;
      text-align: center;
    }

    @keyframes pulse {
      from {
        transform: scale(1);
      }
      to {
        transform: scale(1.025);
      }
    }

    @media (max-width: 900px) {
      .main-grid {
        grid-template-columns: 1fr;
      }

      .mode {
        font-size: 48px;
      }

      .players {
        grid-template-columns: repeat(5, 1fr);
      }

      .player-card {
        font-size: 32px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>だるまさんが転んだ</h1>

    <section class="top-panel">
      <button id="startGameBtn" class="start-btn">開始</button>
      <button id="stopGameBtn" class="stop-btn">停止</button>
      <button id="resetBtn" class="reset-btn">リセット</button>
    </section>

    <section class="main-grid">
      <div class="daruma-panel">
        <img
          id="darumaImage"
          class="daruma-img"
          src="images/daruma-back.png"
          alt="だるまさん"
        />

        <div id="modeView" class="mode">待機中</div>
      </div>

      <div class="side-panel">
        <div id="turnView" class="turn">ターン：0</div>
        <div id="message" class="message">開始ボタンを押してください</div>

        <h2>参加者</h2>

        <div id="players" class="players"></div>

        <div class="settings">
          <div>裏画像：動いてOK</div>
          <div>表画像：止まれ</div>
          <div>アウト表示：約1秒で自動解除</div>
          <div>人数：1〜5番</div>
        </div>

        <div id="log" class="log">未開始</div>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import {
      getDatabase,
      ref,
      set,
      update,
      remove,
      onValue,
      onChildAdded,
      query,
      orderByChild,
      startAt
    } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-database.js";

    const firebaseConfig = {
      apiKey: "ここに入力",
      authDomain: "ここに入力",
      databaseURL: "ここに入力",
      projectId: "ここに入力",
      storageBucket: "ここに入力",
      messagingSenderId: "ここに入力",
      appId: "ここに入力"
    };

    const ROOM_ID = "daruma-main";

    const PLAYER_COUNT = 5;

    const DARUMA_FRONT_IMAGE = "images/daruma-front.png";
    const DARUMA_BACK_IMAGE = "images/daruma-back.png";

    const RUNNING_MIN_MS = 3000;
    const RUNNING_MAX_MS = 7000;

    const STOP_MIN_MS = 1800;
    const STOP_MAX_MS = 3200;

    const OUT_DISPLAY_MS = 1000;

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const startGameBtn = document.getElementById("startGameBtn");
    const stopGameBtn = document.getElementById("stopGameBtn");
    const resetBtn = document.getElementById("resetBtn");

    const darumaImage = document.getElementById("darumaImage");
    const modeView = document.getElementById("modeView");
    const turnView = document.getElementById("turnView");
    const message = document.getElementById("message");
    const playersView = document.getElementById("players");
    const log = document.getElementById("log");

    let currentMode = "idle";
    let isGameRunning = false;
    let timerId = null;
    let turn = 0;
    let stopPhaseResolved = false;
    let sessionStartTime = Date.now();

    const playerCards = new Map();

    function basePath() {
      return `daruma/${ROOM_ID}`;
    }

    function showLog(text) {
      log.textContent = text;
    }

    function randomMs(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function clearTimer() {
      if (timerId) {
        clearTimeout(timerId);
        timerId = null;
      }
    }

    function createPlayerCards() {
      playersView.innerHTML = "";
      playerCards.clear();

      for (let i = 1; i <= PLAYER_COUNT; i++) {
        const card = document.createElement("div");
        card.className = "player-card";
        card.textContent = i;
        card.dataset.playerNo = String(i);

        playersView.appendChild(card);
        playerCards.set(String(i), card);
      }
    }

    function clearOutDisplay() {
      for (const card of playerCards.values()) {
        card.classList.remove("out");
      }
    }

    function showOutPlayer(playerNo) {
      clearOutDisplay();

      const card = playerCards.get(String(playerNo));

      if (card) {
        card.classList.add("out");
      }

      message.textContent = `${playerNo} 番 アウト！`;
    }

    async function setMode(mode) {
      currentMode = mode;

      await update(ref(db, `${basePath()}/state`), {
        mode,
        turn,
        updatedAt: Date.now()
      });

      if (mode === "running") {
        darumaImage.src = DARUMA_BACK_IMAGE;
        modeView.textContent = "動いてOK";
        modeView.className = "mode running";
      } else if (mode === "stop") {
        darumaImage.src = DARUMA_FRONT_IMAGE;
        modeView.textContent = "止まれ";
        modeView.className = "mode stop";
      } else {
        darumaImage.src = DARUMA_BACK_IMAGE;
        modeView.textContent = "待機中";
        modeView.className = "mode";
      }
    }

    async function startGame() {
      if (isGameRunning) {
        showLog("すでに進行中です");
        return;
      }

      isGameRunning = true;
      sessionStartTime = Date.now();
      turn = 0;
      stopPhaseResolved = false;

      await remove(ref(db, `${basePath()}/events`));
      await remove(ref(db, `${basePath()}/violations`));

      clearOutDisplay();
      showLog("ゲーム開始");
      message.textContent = "ゲーム開始！";

      nextRunningPhase();
    }

    async function stopGame() {
      isGameRunning = false;
      clearTimer();

      await setMode("idle");

      clearOutDisplay();
      message.textContent = "停止中";
      showLog("ゲームを停止しました");
    }

    async function resetGame() {
      isGameRunning = false;
      clearTimer();
      turn = 0;
      stopPhaseResolved = false;

      await remove(ref(db, `${basePath()}/events`));
      await remove(ref(db, `${basePath()}/violations`));
      await setMode("idle");

      clearOutDisplay();
      turnView.textContent = "ターン：0";
      message.textContent = "開始ボタンを押してください";
      showLog("リセットしました");
    }

    async function nextRunningPhase() {
      if (!isGameRunning) return;

      clearTimer();
      clearOutDisplay();

      turn++;
      turnView.textContent = `ターン：${turn}`;
      message.textContent = "進め！";
      stopPhaseResolved = false;

      await setMode("running");

      const duration = randomMs(RUNNING_MIN_MS, RUNNING_MAX_MS);

      showLog(`running：${duration / 1000}秒`);

      timerId = setTimeout(() => {
        nextStopPhase();
      }, duration);
    }

    async function nextStopPhase() {
      if (!isGameRunning) return;

      clearTimer();

      message.textContent = "止まれ！";
      stopPhaseResolved = false;

      await setMode("stop");

      const duration = randomMs(STOP_MIN_MS, STOP_MAX_MS);

      showLog(`stop：${duration / 1000}秒`);

      timerId = setTimeout(() => {
        if (!stopPhaseResolved) {
          nextRunningPhase();
        }
      }, duration);
    }

    async function handleViolation(playerNo) {
      if (!isGameRunning) return;
      if (currentMode !== "stop") return;
      if (stopPhaseResolved) return;

      stopPhaseResolved = true;
      clearTimer();

      await set(ref(db, `${basePath()}/violations/${playerNo}`), {
        playerNo,
        turn,
        time: Date.now()
      });

      showOutPlayer(playerNo);
      showLog(`${playerNo}番がアウト`);

      timerId = setTimeout(() => {
        clearOutDisplay();

        if (isGameRunning) {
          nextRunningPhase();
        }
      }, OUT_DISPLAY_MS);
    }

    function listenEvents() {
      const eventsQuery = query(
        ref(db, `${basePath()}/events`),
        orderByChild("clientTime"),
        startAt(sessionStartTime)
      );

      onChildAdded(eventsQuery, async (snapshot) => {
        const event = snapshot.val();

        if (!event || !event.playerNo) return;

        showLog(`受信：${event.playerNo}番`);

        await handleViolation(event.playerNo);
      });
    }

    function listenStateFromFirebase() {
      onValue(ref(db, `${basePath()}/state/mode`), (snapshot) => {
        const mode = snapshot.val();

        if (!mode) return;

        currentMode = mode;
      });
    }

    createPlayerCards();
    listenEvents();
    listenStateFromFirebase();

    startGameBtn.addEventListener("click", startGame);
    stopGameBtn.addEventListener("click", stopGame);
    resetBtn.addEventListener("click", resetGame);
  </script>
</body>
</html>
