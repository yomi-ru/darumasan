<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ストップ!だるまさん 親端末</title>
  <link rel="stylesheet" href="parent.css">
</head>

<body>
  <main class="container">

    <section class="top-panel">
      <button id="startGameBtn" class="start-btn">開始</button>
      <button id="stopGameBtn" class="stop-btn">停止</button>
      <button id="resetBtn" class="reset-btn">リセット</button>
    </section>

    <section class="main-grid">
      <div class="daruma-panel">
        <img id="darumaImage" class="daruma-img" src="../images/front.png" alt="だるまさん" />

        <div id="modeView" class="mode">待機中</div>
      </div>

      <div class="side-panel">
        <div id="turnView" class="turn">ターン：0</div>
        <div id="message" class="message">開始ボタンを押してください</div>

        <h2>参加者</h2>

        <div id="players" class="players"></div>

        <div id="log" class="log">未開始</div>
      </div>
    </section>
  </main>

  <script type="module" src="parent.js"></script>
</body>

</html>
