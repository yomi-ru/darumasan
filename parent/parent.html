<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ストップ!だるまさん 親端末</title>
  <link rel="stylesheet" href="parent.css">
</head>

<body>
  <main class="screen">
    <section id="startOverlay" class="start-overlay">
      <div class="start-card">
        <div class="mini-title">REALTIME JUDGE</div>
        <h1>STOP!<br>だるまさん</h1>
        <p>準備ができたら開始してください</p>
        <button id="startGameBtn" class="start-btn">開始</button>
      </div>
    </section>

    <section id="gameView" class="game-view">
      <div id="modeText" class="mode-text">待機中</div>

      <div class="daruma-stage">
        <img
          id="darumaImage"
          class="daruma-img"
          src="../images/rear.png"
          alt="だるまさん"
        />
      </div>

      <div id="players" class="players"></div>
    </section>

    <div id="toast" class="toast">Sキーで停止</div>
  </main>

  <script type="module" src="parent.js"></script>
</body>

</html>
