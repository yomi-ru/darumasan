<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ストップ!だるまさん 子端末</title>
    <link rel="stylesheet" href="player.css" />
</head>

<body>
    <main class="app">
        <h1>子端末</h1>

        <label for="playerNo">参加者番号</label>
        <input id="playerNo" placeholder="例: 1" inputmode="numeric" />

        <button id="saveBtn">設定して待機</button>
        <button id="focusBtn">この画面を有効化</button>

        <div id="stateBox" class="status">
            現在状態
            <div id="modeText" class="big">未接続</div>
        </div>

        <div class="log" id="log">スペースキー入力を待機しています</div>
    </main>

    <script type="module" src="player.js"></script>
</body>

</html>
