<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>だるまさんが転んだ 子端末</title>

    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Yu Gothic", sans-serif;
            margin: 0;
            background: #111827;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: min(92vw, 420px);
            background: #1f2937;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 16px;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 16px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            font-size: 22px;
            border-radius: 12px;
            border: none;
            outline: none;
            text-align: center;
            font-weight: bold;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            background: #38bdf8;
            color: #0f172a;
        }

        .status {
            margin-top: 18px;
            padding: 16px;
            border-radius: 14px;
            background: #374151;
            font-size: 18px;
        }

        .big {
            font-size: 42px;
            font-weight: bold;
            margin-top: 10px;
        }

        .log {
            margin-top: 16px;
            font-size: 14px;
            color: #d1d5db;
            min-height: 20px;
        }

        .danger {
            background: #ef4444;
        }

        .safe {
            background: #22c55e;
        }
    </style>
</head>

<body>
    <main class="app">
        <h1>子端末</h1>

        <label for="playerNo">参加者番号</label>
        <input id="playerNo" placeholder="例: 1" inputmode="numeric" />

        <button id="saveBtn">設定して待機</button>
        <button id="focusBtn">この画面を有効化</button>

        <div id="stateBox" class="status">
            現在状態
            <div id="modeText" class="big">未接続</div>
        </div>

        <div class="log" id="log">スペースキー入力を待機しています</div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
        import {
            getDatabase,
            ref,
            push,
            set,
            serverTimestamp,
            onValue
        } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZClEsb5RkhHcTr9eJtOmC3oWYdt4MKps",
            authDomain: "darumasan-ff1bd.firebaseapp.com",
            projectId: "darumasan-ff1bd",
            storageBucket: "darumasan-ff1bd.firebasestorage.app",
            messagingSenderId: "714642759200",
            appId: "1:714642759200:web:c2e882eecc94bb598a6645",
            measurementId: "G-F6FGRBSEHL"
        };

        const ROOM_ID = "daruma-main";

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const playerNoInput = document.getElementById("playerNo");
        const saveBtn = document.getElementById("saveBtn");
        const focusBtn = document.getElementById("focusBtn");
        const log = document.getElementById("log");
        const modeText = document.getElementById("modeText");
        const stateBox = document.getElementById("stateBox");

        let playerNo = localStorage.getItem("daruma_playerNo") || "";
        let lastSendTime = 0;

        const debounceMs = 700;

        playerNoInput.value = playerNo;

        function showLog(message) {
            log.textContent = message;
        }

        function saveSettings() {
            playerNo = playerNoInput.value.trim();

            if (!playerNo) {
                alert("参加者番号を入力してね！");
                return;
            }

            localStorage.setItem("daruma_playerNo", playerNo);
            listenGameState();

            showLog(`参加者 ${playerNo} として待機中`);
            document.body.focus();
        }

        function listenGameState() {
            const stateRef = ref(db, `daruma/${ROOM_ID}/state/mode`);

            onValue(stateRef, (snapshot) => {
                const mode = snapshot.val();

                if (mode === "stop") {
                    modeText.textContent = "止まれ";
                    stateBox.className = "status danger";
                } else if (mode === "running") {
                    modeText.textContent = "動いてOK";
                    stateBox.className = "status safe";
                } else {
                    modeText.textContent = "待機中";
                    stateBox.className = "status";
                }
            });
        }

        async function sendSpaceEvent() {
            if (!playerNo) {
                showLog("先に参加者番号を設定してね！");
                return;
            }

            const now = Date.now();

            if (now - lastSendTime < debounceMs) {
                showLog("連続入力を無視しました");
                return;
            }

            lastSendTime = now;

            const eventRef = push(ref(db, `daruma/${ROOM_ID}/events`));

            await set(eventRef, {
                playerNo,
                clientTime: now,
                createdAt: serverTimestamp()
            });

            showLog(`送信しました：参加者 ${playerNo}`);
        }

        saveBtn.addEventListener("click", saveSettings);

        focusBtn.addEventListener("click", () => {
            document.body.focus();
            showLog("画面を有効化しました。スペースキー入力を待機中");
        });

        document.addEventListener("keydown", (event) => {
            if (event.code === "Space" || event.key === " ") {
                event.preventDefault();
                sendSpaceEvent();
            }
        });

        if (playerNo) {
            listenGameState();
        }
    </script>
</body>

</html>
